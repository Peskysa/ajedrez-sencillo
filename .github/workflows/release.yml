name: Compilar y publicar
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test
      - run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node scripts/build-web.cjs
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.13'
      - run: gradle -p android assembleDebug
      - run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/ajedrez-sencillo-1.1.0-android-preview.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-preview
          path: dist/android/*.apk
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node scripts/build-web.cjs
      - run: cd dist/web && zip -r ../ajedrez-sencillo-web.zip .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web-portatil
          path: dist/ajedrez-sencillo-web.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-files
          merge-multiple: true
      - name: Generar hashes y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Ajedrez sencillo ${GITHUB_REF_NAME}" --notes-file "../docs/releases/${GITHUB_REF_NAME}.md" --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "Ajedrez sencillo ${GITHUB_REF_NAME}" --notes-file "../docs/releases/${GITHUB_REF_NAME}.md" --verify-tag
          fi
