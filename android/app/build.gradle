plugins { id 'com.android.application' }
android {
    namespace 'io.github.peskysa.ajedrezsencillo'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.peskysa.ajedrezsencillo'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.register('copyWebAssets', Copy) {
    from '../../dist/web'
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
